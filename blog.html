<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blog — PrajñaVerse</title>
<meta name="description" content="Writing on code, markets, and craft — by Raushan Raj." />
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="site-header" class="site-nav"></header>

<header class="hero" style="padding-bottom:3rem;">
  <div class="container">
    <div class="verse-marker"><span>VI</span><span class="deva">॥</span><span>Blog</span></div>
    <h1 style="font-size:clamp(2rem,4vw,3rem);">Notes on code, markets, and craft.</h1>
    <p class="lede">Long-form writing, published straight from Supabase — no rebuild needed to ship a new post.</p>
  </div>
</header>

<section style="padding-top:0;">
  <div class="container">
    <div id="posts-list" class="grid grid-2">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
    <div id="posts-empty" class="empty-state" style="display:none;">
      No posts published yet — add a row to the <code>blog_posts</code> table in Supabase and it will appear here.
    </div>
  </div>
</section>

<footer id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/partials.js"></script>
<script src="js/main.js"></script>
<script>
(async function () {
  const list = document.getElementById("posts-list");
  const empty = document.getElementById("posts-empty");
  const posts = await window.PrajnaDB.fetchPosts();

  if (!posts.length) {
    list.style.display = "none";
    empty.style.display = "block";
    return;
  }

  list.innerHTML = posts.map((p) => {
    const date = p.published_at ? new Date(p.published_at).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) : "";
    const tags = (p.tags || []).map(t => `<span class="chip">${t}</span>`).join("");
    return `
      <a href="blog-post.html?slug=${encodeURIComponent(p.slug)}" class="card" style="display:block;">
        <p class="post-meta">${date}</p>
        <h3>${p.title}</h3>
        <p>${p.excerpt || ""}</p>
        <div class="chip-row">${tags}</div>
      </a>
    `;
  }).join("");
})();
</script>
</body>
</html>
