<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — PrajñaVerse</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-black text-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary border-opacity-25 py-3 px-4">
    <div class="container">
      <a class="navbar-brand text-gold fs-4 fw-bold" href="index.html">PrajñaVerse Admin</a>
    </div>
  </nav>

  <main class="container py-5">
    <h1 class="h3 text-gold fw-bold mb-4">Content Control Panel</h1>
    
    <div class="pv-card p-4 max-w-600 mb-4">
      <h3 class="h5 text-light fw-bold mb-3">Add New Artifact</h3>
      <div class="mb-3">
        <input type="text" id="adminProdTitle" class="form-control bg-transparent text-light border-secondary" placeholder="Product Title">
      </div>
      <div class="mb-3">
        <input type="text" id="adminProdPrice" class="form-control bg-transparent text-light border-secondary" placeholder="Price (e.g. $29)">
      </div>
      <button class="btn btn-gold w-100" onclick="alert('Item cached to local memory.')">Save Artifact</button>
    </div>
  </main>

</body>
</html>
