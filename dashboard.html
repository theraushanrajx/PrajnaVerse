<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — PrajñaVerse</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary border-opacity-25 py-3 px-4">
    <div class="container">
      <a class="navbar-brand text-gold fs-4 fw-bold" href="index.html">PrajñaVerse</a>
      <button onclick="logoutUser()" class="btn btn-outline-danger btn-sm ms-auto">Log Out</button>
    </div>
  </nav>

  <main class="container py-5">
    <h1 class="display-5 text-gold fw-bold mb-2">User Control Center</h1>
    <p class="text-secondary mb-4">Welcome back, <span id="userDisplayName" class="text-light">Member</span>.</p>

    <div class="pv-card p-4 mb-4">
      <h3 class="h5 text-gold fw-bold mb-3">Saved Library</h3>
      <div id="savedItemsContainer" class="text-secondary small">No items saved to your session library yet.</div>
    </div>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
