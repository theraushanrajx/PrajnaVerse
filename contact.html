<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — PrajñaVerse</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column vh-100">

  <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary border-opacity-25 py-3 px-4">
    <div class="container">
      <a class="navbar-brand text-gold fs-4 fw-bold" href="index.html">PrajñaVerse</a>
      <div class="ms-auto">
        <a href="index.html" class="btn btn-outline-warning btn-sm">Home</a>
      </div>
    </div>
  </nav>

  <main class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="pv-card p-4 p-md-5">
          <h2 class="text-gold fw-bold h3 mb-2">Initiate Contact</h2>
          <p class="text-secondary small mb-4">Direct client submission pipeline.</p>

          <form action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY">
            <div class="mb-3">
              <input type="text" name="name" class="form-control bg-transparent text-light border-secondary" placeholder="Your Name" required>
            </div>
            <div class="mb-3">
              <input type="email" name="email" class="form-control bg-transparent text-light border-secondary" placeholder="Your Email" required>
            </div>
            <div class="mb-3">
              <textarea name="message" rows="4" class="form-control bg-transparent text-light border-secondary" placeholder="Your Message" required></textarea>
            </div>
            <button type="submit" class="btn btn-gold w-100 py-2">Dispatch Message</button>
          </form>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
