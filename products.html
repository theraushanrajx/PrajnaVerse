<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Products — PrajñaVerse</title>
<meta name="description" content="Ebooks, courses, and tools by Raushan Raj — PrajñaVerse." />
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="site-header" class="site-nav"></header>

<header class="hero" style="padding-bottom:3rem;">
  <div class="container">
    <div class="verse-marker"><span>V</span><span class="deva">॥</span><span>Products</span></div>
    <h1 style="font-size:clamp(2rem,4vw,3rem);">Things I've made for you to use.</h1>
    <p class="lede">Ebooks, courses, and tools — built from what I've learned shipping code and trading markets. Managed live from Supabase.</p>
  </div>
</header>

<section style="padding-top:0;">
  <div class="container">
    <div id="products-grid" class="grid grid-3">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
    <div id="products-empty" class="empty-state" style="display:none;">
      No products published yet — check back soon, or add rows to the <code>products</code> table in Supabase.
    </div>
  </div>
</section>

<footer id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/partials.js"></script>
<script src="js/main.js"></script>
<script>
(async function () {
  const grid = document.getElementById("products-grid");
  const empty = document.getElementById("products-empty");
  const products = await window.PrajnaDB.fetchProducts();

  if (!products.length) {
    grid.style.display = "none";
    empty.style.display = "block";
    return;
  }

  grid.innerHTML = products.map((p) => `
    <div class="card">
      <span class="tag">${p.category ? p.category.toUpperCase() : "PRODUCT"}</span>
      <h3>${p.title}</h3>
      <p>${p.description || ""}</p>
      <p class="post-meta">${p.is_free ? "Free" : (p.price_inr ? "₹" + p.price_inr : "")}</p>
      ${p.external_url ? `<a href="${p.external_url}" class="btn" target="_blank" rel="noopener">Get it ↗</a>` : ""}
    </div>
  `).join("");
})();
</script>
</body>
</html>
