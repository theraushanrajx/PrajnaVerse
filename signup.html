<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — PrajñaVerse</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-black">

  <div class="container max-w-400">
    <div class="pv-card p-4 p-md-5">
      <h2 class="text-gold fw-bold h4 mb-3 text-center">Register Account</h2>
      <form id="signupForm">
        <div class="mb-3">
          <input type="text" id="regName" class="form-control bg-transparent text-light border-secondary" placeholder="Full Name" required>
        </div>
        <div class="mb-3">
          <input type="email" id="regEmail" class="form-control bg-transparent text-light border-secondary" placeholder="Email" required>
        </div>
        <div class="mb-3">
          <input type="password" id="regPass" class="form-control bg-transparent text-light border-secondary" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-gold w-100 mb-3">Create Account</button>
        <p class="text-center small text-secondary m-0">Already registered? <a href="login.html" class="text-gold">Log In</a></p>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
